name: Build and deploy to Cloudflare Pages

# Pushes to the production branch (default: main) publish the live site.
# Pushes to any other branch, and pull requests from this repo, publish a
# Cloudflare Pages preview URL. Pull requests from forks build and test only.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables)
  CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'farmington-hb1300' }}
  CF_PRODUCTION_BRANCH: ${{ vars.CF_PRODUCTION_BRANCH || 'main' }}
  SITE_URL: ${{ vars.SITE_URL }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check every source is cited and every citation exists
        run: npm run check:sources

      - name: Build site
        run: npm run build

      - name: Check every outside link opens in a new window with rel="nofollow"
        run: npm run check:links

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Fork PRs never receive secrets, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ (github.head_ref || github.ref_name) == (vars.CF_PRODUCTION_BRANCH || 'main') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Skip when Cloudflare secrets are not set yet
        if: env.HAS_CF_SECRETS != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; skipping deploy. See README.md."

      - uses: actions/download-artifact@v4
        if: env.HAS_CF_SECRETS == 'true'
        with:
          name: site
          path: dist

      - uses: actions/setup-node@v4
        if: env.HAS_CF_SECRETS == 'true'
        with:
          node-version: 22

      # Creates the Pages project on first run; harmless if it already exists.
      - name: Ensure Cloudflare Pages project exists
        if: env.HAS_CF_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$CF_PAGES_PROJECT"; then
            echo "Pages project $CF_PAGES_PROJECT exists."
          else
            npx --yes wrangler@4 pages project create "$CF_PAGES_PROJECT" --production-branch="$CF_PRODUCTION_BRANCH"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }} --commit-dirty=true
