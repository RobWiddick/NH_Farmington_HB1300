name: Build and deploy to Cloudflare Pages

# Pushes to the production branch (default: main) publish the live site.
# Pushes to any other branch, and pull requests from this repo, publish a
# Cloudflare Pages preview URL. Pull requests from forks build and test only.
#
# Each deploy also syncs the "Ask a question" assistant's documents
# (chat-corpus/, built from the page and chat/primary/) into Cloudflare AI
# Search: production uses the farmington-hb1300 instance, previews use
# farmington-hb1300-preview (see wrangler.toml).
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  # Optional repository variables (Settings -> Secrets and variables -> Actions -> Variables)
  CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'farmington-hb1300' }}
  CF_PRODUCTION_BRANCH: ${{ vars.CF_PRODUCTION_BRANCH || 'main' }}
  SITE_URL: ${{ vars.SITE_URL }}
  # Preview builds (every branch but production) tell search engines to stay out.
  SITE_NOINDEX: ${{ (github.head_ref || github.ref_name) != (vars.CF_PRODUCTION_BRANCH || 'main') && '1' || '' }}
  # IndexNow key (public by design; the matching file is public/<key>.txt).
  INDEXNOW_KEY: a7d937f76b067b53414c6ab95c429cbb
  WRANGLER_SEND_METRICS: 'false'

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check every source is cited and every citation exists
        run: npm run check:sources

      - name: Build site and the assistant's documents
        run: npm run build

      - name: Check every outside link opens in a new window with rel="nofollow"
        run: npm run check:links

      - name: Test the assistant (/api/chat)
        run: npm run test:chat

      - name: Compile the Pages Function
        run: npm run check:functions

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist
            chat-corpus
          retention-days: 7

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    # Fork PRs never receive secrets, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ (github.head_ref || github.ref_name) == (vars.CF_PRODUCTION_BRANCH || 'main') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      HAS_CF_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      AI_SEARCH_INSTANCE: ${{ (github.head_ref || github.ref_name) == (vars.CF_PRODUCTION_BRANCH || 'main') && 'farmington-hb1300' || 'farmington-hb1300-preview' }}
    steps:
      - name: Skip when Cloudflare secrets are not set yet
        if: env.HAS_CF_SECRETS != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set; skipping deploy. See README.md."

      # The checkout brings functions/, chat/lib/ and wrangler.toml; the
      # artifact brings the tested build (dist/ and chat-corpus/).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the IndexNow step checks whether the page changed
        if: env.HAS_CF_SECRETS == 'true'

      - uses: actions/download-artifact@v4
        if: env.HAS_CF_SECRETS == 'true'
        with:
          name: site
          path: .

      - uses: actions/setup-node@v4
        if: env.HAS_CF_SECRETS == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: env.HAS_CF_SECRETS == 'true'
        run: npm ci

      # Creates the Pages project on first run; harmless if it already exists.
      - name: Ensure Cloudflare Pages project exists
        if: env.HAS_CF_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx wrangler pages project list | grep -qw "$CF_PAGES_PROJECT"; then
            echo "Pages project $CF_PAGES_PROJECT exists."
          else
            npx wrangler pages project create "$CF_PAGES_PROJECT" --production-branch="$CF_PRODUCTION_BRANCH"
          fi

      # Never blocks the site: if this fails, the assistant says it's unavailable.
      - name: Sync the assistant's documents to AI Search
        if: env.HAS_CF_SECRETS == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run chat:sync

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: env.HAS_CF_SECRETS == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.CF_PAGES_PROJECT }} --branch=${{ github.head_ref || github.ref_name }} --commit-hash=${{ github.event.pull_request.head.sha || github.sha }} --commit-dirty=true

      # Tells Bing (and the other IndexNow engines) the page changed, so updates reach
      # Bing search, Copilot and ChatGPT search quickly. Production only; never blocks a deploy.
      - name: Notify search engines (IndexNow)
        if: env.HAS_CF_SECRETS == 'true' && env.SITE_NOINDEX != '1' && env.SITE_URL != ''
        continue-on-error: true
        run: |
          # Only when the page itself may have changed (IndexNow asks not to resubmit unchanged URLs).
          before='${{ github.event.before }}'
          if [ -n "$before" ] && git cat-file -e "$before" 2>/dev/null && git diff --quiet "$before" "$GITHUB_SHA" -- src public scripts astro.config.mjs package.json; then
            echo 'Page unchanged; skipping IndexNow.'; exit 0
          fi
          host="${SITE_URL#https://}"; host="${host%/}"
          body="{\"host\":\"$host\",\"key\":\"$INDEXNOW_KEY\",\"keyLocation\":\"https://$host/$INDEXNOW_KEY.txt\",\"urlList\":[\"https://$host/\"]}"
          for i in 1 2 3 4 5 6; do
            curl -sS -m 15 -o /dev/null -w '%{http_code}' "https://$host/$INDEXNOW_KEY.txt" | grep -q 200 && break
            sleep 10
          done
          code=$(curl -sS -m 30 -o indexnow.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'content-type: application/json; charset=utf-8' -d "$body" || true)
          echo "IndexNow: HTTP $code $(cat indexnow.txt 2>/dev/null)"
          case "$code" in 200|202) ;; *) echo "::warning title=IndexNow::HTTP $code $(cat indexnow.txt 2>/dev/null)" ;; esac

      - name: Ask the deployed assistant a test question
        if: env.HAS_CF_SECRETS == 'true' && steps.deploy.outputs.deployment-url != ''
        continue-on-error: true
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          sleep 10
          curl -sS -m 90 -o answer.txt -w '%{http_code}' -X POST "$URL/api/chat" \
            -H "origin: $URL" -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"Does Question 2 only cap administration?"}]}' > status.txt || true
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("answer.txt", "utf8"), http = fs.readFileSync("status.txt", "utf8");
            let meta = null, text = "";
            for (const block of raw.split("\n\n")) {
              const ev = /^event: (.*)$/m.exec(block)?.[1], data = /^data: (.*)$/m.exec(block)?.[1];
              if (!data || data === "[DONE]") continue;
              try { const o = JSON.parse(data); if (ev === "meta") meta = o; else text += o.response ?? o.choices?.[0]?.delta?.content ?? ""; } catch {}
            }
            const ok = meta?.status === "answer" && text.trim().length > 0;
            console.log(`HTTP ${http} status=${meta?.status ?? "none"} sources=${meta?.sources?.length ?? 0}\n\n${text.trim() || raw.slice(0, 500)}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Assistant test: ${ok ? "answered with sources" : "no answer (see log)"}\n\n> Does Question 2 only cap administration?\n\n${text.trim().slice(0, 1500)}\n`);
            if (!ok) console.log("::warning title=Assistant test question::The deployed assistant did not answer. See this step\x27s log.");
          '
